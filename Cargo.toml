[package]
name = "NeoClef"
version = "0.1.0"
edition = "2024"

[lib]
name = "neoclef"

[[bin]]
name = "NeoClef"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:env_logger", "miette/fancy"]

[dependencies]
midly = "0.5.3"
quick-xml = "0.41.0"
thiserror = "2.0.18"
log = "0.4.29"
env_logger = { version = "0.11.8", optional = true }
miette = "7.6.0"

[dev-dependencies]
insta = "1.43.1"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[profile.dev.package]
insta.opt-level = 3
similar.opt-level = 3
